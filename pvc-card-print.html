<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVC Card Print Layout - QuickTools</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        header { background-color: #007bff; color: white; padding: 15px; text-align: center; border-radius: 5px; margin-bottom: 20px; }
        
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .upload-section { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .upload-box { flex: 1; min-width: 250px; background: #f9f9f9; padding: 15px; border: 2px dashed #007bff; border-radius: 6px; text-align: center; }
        .upload-box label { font-weight: bold; display: block; margin-bottom: 10px; color: #333; }
        
        .preview-container { text-align: center; margin-top: 25px; border-top: 2px solid #eee; padding-top: 20px; }
        
        /* A4 पेपर लेआउट सिम्युलेशन */
        .a4-sheet { width: 595px; height: 842px; background: white; border: 1px solid #ccc; margin: 20px auto; padding: 40px; box-sizing: border-box; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 20px; align-items: center; }
        
        .card-row { display: flex; gap: 20px; }
        .card-preview { width: 240px; height: 150px; border: 1px dashed #999; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; position: relative; }
        .card-preview img { width: 100%; height: 100%; object-fit: contain; }
        .card-preview span { color: #888; font-size: 13px; text-align: center; padding: 10px; }

        .btn-print { background-color: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-print:hover { background-color: #218838; }

        @media print {
            body { background: white; padding: 0; }
            header, .container > .upload-section, .container > h3, .container > p, .back-link, .btn-print { display: none; }
            .a4-sheet { border: none; box-shadow: none; margin: 0; padding: 0; }
        }

        .back-link { display: block; margin-top: 25px; color: #007bff; text-decoration: none; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h2>QuickTools.in - PVC Card Print Layout</h2>
    </header>

    <div class="container">
        <h3>🖨️ A4 PVC Card Layout Maker</h3>
        <p>आईडी कार्ड की फ्रंट और बैक फोटो अपलोड करें ताकि A4 शीट पर सही एलाइनमेंट मिल सके।</p>
        
        <div class="upload-section">
            <div class="upload-box">
                <label>आईडी कार्ड का सामने का हिस्सा (Front):</label>
                <input type="file" id="frontInput" accept="image/*" onchange="loadCard(event, 'frontImg')">
            </div>
            <div class="upload-box">
                <label>आईडी कार्ड का पीछे का हिस्सा (Back):</label>
                <input type="file" id="backInput" accept="image/*" onchange="loadCard(event, 'backImg')">
            </div>
        </div>

        <div class="preview-container">
            <h4>📄 A4 प्रिंट प्रीव्यू (Print Preview)</h4>
            
            <!-- A4 शीट बॉक्स -->
            <div class="a4-sheet" id="printArea">
                <div class="card-row">
                    <div class="card-preview">
                        <span id="frontText">Front Side 1</span>
                        <img id="frontImg" style="display:none;">
                    </div>
                    <div class="card-preview">
                        <span id="backText">Back Side 1</span>
                        <img id="backImg" style="display:none;">
                    </div>
                </div>
            </div>

            <button class="btn-print" onclick="window.print()">🖨️ A4 शीट प्रिंट करें (Print)</button>
        </div>

        <a href="index.html" class="back-link">← वापस होमपेज पर जाएं</a>
    </div>

    <script>
        function loadCard(event, imgId) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let imgElement = document.getElementById(imgId);
                imgElement.src = e.target.result;
                imgElement.style.display = "block";
                
                // टेक्स्ट छुपाएं
                if(imgId === 'frontImg') document.getElementById('frontText').style.display = 'none';
                if(imgId === 'backImg') document.getElementById('backText').style.display = 'none';
            }
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>

</body>
</html>
