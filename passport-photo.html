<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Photo Maker - QuickTools</title>
    
    <!-- Cropper.js के लिए सुरक्षित फ्री लाइब्रेरी (CSS और JS) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; }
        header { background-color: #007bff; color: white; padding: 15px; text-align: center; }
        
        .container { max-width: 700px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        
        input[type="file"] { margin: 15px 0; font-size: 16px; border: 2px dashed #007bff; padding: 15px; width: 100%; box-sizing: border-box; cursor: pointer; background-color: #f9f9f9; }
        
        /* Cropping एरिया का डिज़ाइन */
        .crop-container { max-width: 100%; height: 400px; margin: 20px auto; display: none; background-color: #eee; }
        img#imageToCrop { max-width: 100%; max-height: 100%; display: block; }
        
        .btn-action { background-color: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin: 10px 5px; display: none; }
        .btn-action:hover { background-color: #218838; }
        
        /* रिजल्ट एरिया */
        .result-container { display: none; margin-top: 30px; border-top: 2px solid #ddd; padding-top: 20px; }
        .result-container h4 { color: #333; }
        /* 3.5cm x 4.5cm के अनुपात (Ratio) में फोटो दिखाने के लिए */
        img#croppedResult { width: 140px; height: 180px; border: 1px solid #ccc; padding: 5px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        .btn-down { background-color: #17a2b8; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 15px; text-decoration: none; display: inline-block; font-weight: bold; }
        .btn-down:hover { background-color: #138496; }
        
        .back-link { display: block; margin-top: 25px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h2>QuickTools.in</h2>
    </header>

    <div class="container">
        <h3>📸 Passport Photo Maker</h3>
        <p>अपनी फोटो चुनें, उसे क्रॉप करें और बिल्कुल सही पासपोर्ट साइज़ (3.5cm x 4.5cm) में डाउनलोड करें।</p>
        
        <input type="file" id="uploadImage" accept="image/jpeg, image/png, image/webp">

        <!-- फोटो क्रॉप करने का एरिया -->
        <div class="crop-container" id="cropContainer">
            <img id="imageToCrop" src="" alt="Picture">
        </div>

        <button class="btn-action" id="btnCrop" onclick="cropImage()">✂️ फोटो सेट करें (Crop)</button>

        <!-- क्रॉप होने के बाद फाइनल फोटो का प्रीव्यू -->
        <div class="result-container" id="resultContainer">
            <h4>आपकी पासपोर्ट फोटो (Preview)</h4>
            <img id="croppedResult" src="" alt="Cropped Passport Photo">
            <br>
            <a id="downloadLink" class="btn-down" download="passport_photo.jpg">⬇️ फोटो डाउनलोड करें</a>
        </div>

        <a href="index.html" class="back-link">← वापस होमपेज पर जाएं</a>
    </div>

    <script>
        let cropper = null;
        let image = document.getElementById('imageToCrop');
        let cropContainer = document.getElementById('cropContainer');
        let btnCrop = document.getElementById('btnCrop');
        let resultContainer = document.getElementById('resultContainer');
        
        // यूज़र जब फाइल चुने
        document.getElementById('uploadImage').addEventListener('change', function (e) {
            let files = e.target.files;
            if (files && files.length > 0) {
                let file = files[0];
                let reader = new FileReader();
                
                reader.onload = function (event) {
                    image.src = event.target.result;
                    cropContainer.style.display = 'block';
                    btnCrop.style.display = 'inline-block';
                    resultContainer.style.display = 'none';

                    // अगर पहले से कोई क्रॉपर है, तो उसे हटाएं
                    if (cropper) {
                        cropper.destroy();
                    }

                    // Cropper.js को सेट करना (Passport Size 3.5 : 4.5 Ratio)
                    cropper = new Cropper(image, {
                        aspectRatio: 3.5 / 4.5,
                        viewMode: 1, // फोटो फ्रेम से बाहर न जाए
                        autoCropArea: 0.8,
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        // 'फोटो सेट करें (Crop)' बटन दबाने पर
        function cropImage() {
            if (!cropper) return;

            // हाई क्वालिटी के लिए Canvas की चौड़ाई और ऊँचाई सेट करें
            // 350x450 पिक्सल (जो 3.5x4.5 अनुपात है)
            let canvas = cropper.getCroppedCanvas({
                width: 350,
                height: 450,
                fillColor: '#fff', // अगर PNG हो तो बैकग्राउंड सफेद हो जाए
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            // Canvas को JPG फोटो में बदलना
            let croppedDataUrl = canvas.toDataURL("image/jpeg", 1.0);

            // रिजल्ट स्क्रीन पर दिखाना
            document.getElementById('croppedResult').src = croppedDataUrl;
            document.getElementById('downloadLink').href = croppedDataUrl;
            
            resultContainer.style.display = 'block';
            
            // पेज को थोड़ा नीचे स्क्रॉल करना ताकि रिजल्ट दिख जाए
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
