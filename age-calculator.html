<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - Khojiman.com</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #0066cc, #004080);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        header p {
            font-size: 1rem;
            opacity: 0.9;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #0066cc;
        }
        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f4fd;
            border-left: 5px solid #0066cc;
            border-radius: 4px;
            display: none;
        }
        .result h3 {
            color: #004080;
            margin-bottom: 10px;
        }
        .result p {
            font-size: 1.1rem;
            color: #333;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #222;
            color: white;
            margin-top: 50px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📅 Age Calculator</h1>
        <p>सटीक उम्र, महीने और दिन कैलकुलेट करें</p>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="dob">अपनी जन्मतिथि चुनें (Date of Birth):</label>
            <input type="date" id="dob">
        </div>
        <button class="btn" onclick="calculateAge()">आयु कैलकुलेट करें</button>

        <div class="result" id="resultBox">
            <h3>परिणाम (Result):</h3>
            <p id="ageResult"></p>
        </div>

        <a href="index.html" class="back-link">&larr; होम पेज पर वापस जाएं</a>
    </div>

    <footer>
        <p>&copy; 2026 Khojiman.com. All Rights Reserved.</p>
    </footer>

    <script>
        function calculateAge() {
            const dobInput = document.getElementById('dob').value;
            if (!dobInput) {
                alert('कृपया पहले अपनी जन्मतिथि चुनें!');
                return;
            }

            const dob = new Date(dobInput);
            const today = new Date();

            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();
            let days = today.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            const resultBox = document.getElementById('resultBox');
            const ageResult = document.getElementById('ageResult');

            resultBox.style.display = 'block';
            ageResult.innerHTML = `आपकी उम्र <strong>${years} वर्ष</strong>, <strong>${months} महीने</strong> और <strong>${days} दिन</strong> है।`;
        }
    </script>

</body>
</html>
