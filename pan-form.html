<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New PAN Card Form 93 - QuickTools</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        header { background-color: #007bff; color: white; padding: 15px; text-align: center; border-radius: 5px; margin-bottom: 20px; }
        
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .form-header { text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 15px; margin-bottom: 25px; }
        .form-header h1 { margin: 0; color: #007bff; font-size: 24px; }
        .form-header p { margin: 5px 0 0; color: #666; font-size: 14px; }

        .section-title { background: #e9ecef; padding: 8px 12px; font-weight: bold; margin: 20px 0 10px 0; border-left: 4px solid #007bff; font-size: 15px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        
        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }

        .btn-print { background-color: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; display: block; width: 100%; text-align: center; margin-top: 30px; }
        .btn-print:hover { background-color: #218838; }

        @media print {
            body { background: white; padding: 0; }
            header, .btn-print, .back-link { display: none; }
            .container { box-shadow: none; padding: 0; }
        }

        .back-link { display: block; margin-top: 25px; color: #007bff; text-decoration: none; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h2>QuickTools.in - PAN Card Form Utility</h2>
    </header>

    <div class="container">
        <div class="form-header">
            <h1>APPLICATION FOR PAN (Form 49A / Layout)</h1>
            <p>नया पैन कार्ड आवेदन विवरण फॉर्म</p>
        </div>

        <div class="section-title">1. Personal Details (व्यक्तिगत विवरण)</div>
        
        <div class="form-group">
            <label>Full Name (पूरा नाम):</label>
            <input type="text" placeholder="उदा: RAHUL KUMAR SHARMA">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Father's Name (पिता का नाम):</label>
                <input type="text" placeholder="पिता का पूरा नाम">
            </div>
            <div class="form-group">
                <label>Date of Birth (जन्म तिथि):</label>
                <input type="date">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Gender (लिंग):</label>
                <select>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Transgender</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mobile Number (मोबाइल नंबर):</label>
                <input type="text" placeholder="+91 9876543210">
            </div>
        </div>

        <div class="section-title">2. Address & Communication (पता विवरण)</div>

        <div class="form-group">
            <label>Complete Address (पूरा पता):</label>
            <input type="text" placeholder="मकान नंबर, गली, इलाका, शहर">
        </div>

        <div class="row">
            <div class="form-group">
                <label>State (राज्य):</label>
                <input type="text" placeholder="उदा: Uttar Pradesh">
            </div>
            <div class="form-group">
                <label>Pincode (पिनकोड):</label>
                <input type="text" placeholder="उदा: 201301">
            </div>
        </div>

        <div class="form-group">
            <label>Aadhaar Number (आधार संख्या):</label>
            <input type="text" placeholder="XXXX XXXX XXXX">
        </div>

        <button class="btn-print" onclick="window.print()">🖨️ पैन फॉर्म प्रिंट / PDF करें</button>

        <a href="index.html" class="back-link">← वापस होमपेज पर जाएं</a>
    </div>

</body>
</html>
