<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>रजिस्ट्रेशन | Khojiman.com</title><style>:root{font-family:system-ui,sans-serif;color:#163b31;background:#f6f8f3}body{margin:0}header{background:#123c34;color:white;padding:20px max(5%,20px);display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}a{color:inherit}main{max-width:760px;margin:35px auto;padding:0 18px}.panel{background:white;border:1px solid #dbe6dc;border-radius:18px;padding:26px;box-shadow:0 12px 30px #143b3010}h1{margin-top:0}label{display:block;margin:16px 0 6px;font-weight:600}input,select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #bdcfc2;border-radius:9px;font:inherit}button,.button{display:inline-block;background:#123c34;color:white;border:0;padding:13px 22px;border-radius:9px;cursor:pointer;font:inherit;margin-top:18px;text-decoration:none}.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px}.hint{font-size:13px;color:#5a6f64}#message{color:#9b2b23;font-weight:600}.request{padding:16px;border:1px solid #dae5db;border-radius:10px;margin:12px 0}.request select{max-width:200px}</style></head><body><header><strong>Khojiman.com</strong><a href="index.html">← मुख्य वेबसाइट</a></header><main><section class="panel"><h1>ग्राहक रजिस्ट्रेशन</h1><form id="registerForm"><label for="name">पूरा नाम</label><input id="name" maxlength="100" required><label for="email">ईमेल</label><input id="email" type="email" required><label for="password">पासवर्ड (कम से कम 6 अक्षर)</label><input id="password" type="password" minlength="6" required><button>अकाउंट बनाएँ</button></form><p class="hint">किसी सरकारी पहचान-पत्र, OTP, PIN या बैंक पासवर्ड को यहाँ न भरें।</p><a href="login.html">पहले से अकाउंट है? लॉगिन</a><p id="message" role="status"></p></section></main><script type="module" src="auth.js"></script></body></html>
